<html>
<head>
    <title>Employee login</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #7dd3fc, #c084fc);
            font-family: algerian;
        }
        
        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 40px 50px;
            text-align: center;
            width: 350px;
        }
        
        h2 {
            color: black;
            font-size: 28px;
            margin-bottom: 30px;
            font-family: algerian;
            letter-spacing: 1px;
        }
        
        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: black;
            margin: 10px 0 5px;
            font-family: 'Georgia', serif;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #666;
            border-radius: 20px;
            outline: none;
            text-align: center;
            font-size: 14px;
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.2);
        }
        
        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
        }
        
        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(to right, #7dd3fc, #c084fc);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #7dd3fc, #c084fc);
        }
        button a{
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>EMPLOYEE LOG IN </h2>
        <form>
            <label>NAME: -</label>
            <input type="text" placeholder="Enter Your Name" required>

            <label>PASSWORD: -</label>
            <input type="password" placeholder="Password" required>

            <div class="btn-container">
                <button type="button"><a href="../Task20.html/dashboard3.html">Login</a></button>
                <button type="reset">Cancel</button>
            </div>
        </form>
    </div>

</body>

</html>
