<html>
<head>
    <style>
        .GA{
            text-align: center;
            align-items: center;
            color:white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            position: fixed;
            width:100%;
            top:0;
            left:0;
            height:26px;
        }
        h1{
            font-size: 36px;
            color:white;
            text-align: center;
        }
        body{
            background: linear-gradient(
                135deg,
                #00ffff 0%,
                #a852d6 35%,
                #e84393 65%,
                #4a90e2 100%
            );
            margin:0;
            padding: 0;
            width: 100%;
        }
        .div{
            width:700px;
            height: auto;
            text-align: center;
            border: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 120px auto;
        }
        button{
            border-radius: 15px;
            background-color: blueviolet;
            width: 180px;
            height:50px;
            border:none;
            color:black;
            box-shadow: 0px 16px 20px rgba(0, 0, 0, 0.2);
            font-size: 25px;
            margin: 28px 18px;
            cursor: pointer;
        }
        button:hover{
            color:blue;
        }

         @media (max-width: 1000px){
            h1{
                font-size:30px;
            }
            .div{
                width: 90%;
                margin-left: auto;
            }
            button{
                width: 150px;
                height: 45px;
                font-size: 20px;
                margin: 15px;
            }
        }
        @media (max-width: 768px){
            h1{
                font-size: 28px;
            }
            .div{
                width: 90%;
                margin-left: auto;
            }
            button{
                width: 150px;
                height: 45px;
                font-size: 20px;
                margin: 15px;
            }
        }

        @media (max-width: 480px){
            h1{
                font-size: 22px;
            }
            .div{
                width: 100%;
                margin-top: 120px;
            }
            button{
                width: 120px;
                height: 40px;
                font-size: 18px;
                margin: 12px;
            }
        }

    </style>
</head>

<body>
    <header class="GA"><b>GOOD AFTERNOON TODAY IS MONDAY</b></header>

    <br><br>
    <h1><font face="Algerian">PSK TECHNOLOGIES PVT.LTD IT COMPANY</font></h1>
    <h1><font face="Algerian">ATTENDANCE PORTAL</font></h1>

    <div class="div">
        <button onclick="window.location.href='studentlog.html'"><font face="Algerian">STUDENT</font></button>
        <button onclick="window.location.href='trainerlog.html'"><font face="Algerian">TRAINER</font></button>
        <button onclick="window.location.href='emplog.html'"><font face="Algerian">EMPLOYEE</font></button>

        <button onclick="window.location.href='studentreg.html'"><font face="Algerian">SIGN UP</font></button>
        <button onclick="window.location.href='trainerreg.html'"><font face="Algerian">SIGN UP</font></button>
        <button onclick="window.location.href='empreg.html'"><font face="Algerian">SIGN UP</font></button>
    </div>

</body>

</html>
